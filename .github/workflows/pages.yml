name: Demo page

# Publishes demo/demo.html (synthetic data only) as the GitHub Pages site.
# If the deploy fails with "Get Pages site failed ... Not Found", enable it once:
# Settings > Pages > Source: "GitHub Actions", then re-run this workflow.
on:
  push:
    branches: [main]
    paths: ['demo/demo.html', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp demo/demo.html _site/index.html
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
